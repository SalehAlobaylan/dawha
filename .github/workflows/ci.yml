name: Dawha CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  core-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
      - run: go vet ./...

  ai-research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: python -m evaluation.evaluate_routing

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: docker compose build db
      - run: make db-migrate
      - run: make db-seed
      - run: docker compose exec -T db psql -U dawha -d dawha -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis', 'vector') ORDER BY extname;"
      - run: go test ./internal/research -run 'TestGraph'
        working-directory: services/core-api
        env:
          DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
