name: Dawha CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  core-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...

  ai-research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: python -m evaluation.evaluate_routing
      - name: Every configured quality group, with a machine-readable report
        run: python -m evaluation.evaluate

  # The complete database suite, not a hand-picked subset.
  #
  # `go test ./...` without DATABASE_URL skips every database-backed test, so
  # the run goes through tools/dbtestguard. It fails on a non-zero go test exit,
  # on DATABASE_URL set against a database that was never migrated, on any test
  # that skipped on the database gate, on a package in the required manifest that
  # ran no test at all, and on an acceptance fixture schema left behind. It
  # refuses to run without DATABASE_URL, so this job cannot quietly become the
  # unit tests and still be green.
  database:
    runs-on: ubuntu-latest
    env:
      # The whole job shares one URL, so the migrations, the seed, the suite and
      # the audit cannot disagree about which database they mean.
      DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
      # The local `db` service is built from infra/local/Dockerfile.postgres,
      # which is what provides postgis and vector. A stock postgres image cannot
      # host this schema, so the project name is pinned to keep the compose
      # project out of the way of any other checkout on the runner.
      COMPOSE_PROJECT_NAME: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/core-api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-research/pyproject.toml
      - run: docker compose build db
      - run: make db-migrate
      - run: make db-seed
      - name: The required extensions are installed
        run: docker compose exec -T db psql -U dawha -d dawha -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis', 'vector') ORDER BY extname;"
      # The venv is created and installed into explicitly, because that is the
      # interpreter the next step runs. Installing into the setup-python
      # environment and then calling .venv/bin/python would be two different
      # pythons, and only one of them would exist.
      - name: Install the AI research service into its own venv
        run: |
          python3 -m venv services/ai-research/.venv
          services/ai-research/.venv/bin/pip install --upgrade pip
          services/ai-research/.venv/bin/pip install -e 'services/ai-research[dev]'
      - name: Start the deterministic AI service
        working-directory: services/ai-research
        run: |
          .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then
              echo "ai-research is up"
              exit 0
            fi
            sleep 1
          done
          echo "ai-research did not start" >&2
          exit 1
      - name: Run the complete Go database suite with the skip audit
        working-directory: services/core-api
        env:
          # The one AI-backed Go test runs rather than skips, so the only skips
          # left in the run are ones somebody chose on purpose.
          AI_RESEARCH_URL: http://127.0.0.1:8000
        run: go run ./tools/dbtestguard --audit database-audit.json -- ./...
      - name: The graph packages still run on their own terms
        working-directory: services/core-api
        env:
          DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
        run: go test ./internal/research -run 'TestGraph'
      - name: The analysis packages still run on their own terms
        working-directory: services/core-api
        env:
          DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
        run: go test ./internal/temporalanalysis ./internal/geospatialintelligence ./internal/researchagent ./internal/contradiction ./internal/evidence ./internal/search ./internal/entityresolution
      # The queue is only as real as the process that drains it, so this step starts
      # the analysis worker the way a deployment does - as its own binary, against the
      # same migrated database - accepts a run through the service the API uses, and
      # waits for the run to reach a terminal state. It is the step that would fail
      # if a deployment shipped the API without the worker, which is the failure no
      # unit test can see.
      - name: A consumer really drains the queue
        working-directory: services/core-api
        env:
          DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
          AI_RESEARCH_URL: http://127.0.0.1:8000
        run: go test ./internal/analysisworker -run TestTheAnalysisWorkerBinaryDrains -count=1 -v
      - name: The skip audit is an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-audit
          path: services/core-api/database-audit.json
          if-no-files-found: error

  # The browser acceptance suite, against the same deterministic stack `make e2e`
  # starts locally: PostgreSQL with postgis and vector, the AI service, core-api
  # with its source-processing and analysis workers, and the built web app.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
      COMPOSE_PROJECT_NAME: ci
      CORE_API_PORT: 8181
      AI_RESEARCH_PORT: 8182
      AI_RESEARCH_URL: http://localhost:8182
      WEB_E2E_PORT: 4173
      WEB_ORIGIN: http://localhost:4173
      # Vite reads this at build time, which is why the build is a step of its
      # own rather than part of the test command.
      VITE_API_URL: http://localhost:8181
      SOURCE_STORAGE_DIR: /tmp/dawha-e2e-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/core-api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-research/pyproject.toml
      - run: docker compose build db
      - run: make db-migrate
      - run: make db-seed
      # apps/web/e2e/stack.mjs starts the AI service from
      # services/ai-research/.venv and refuses to run without it, so the venv is
      # the interpreter this job uses end to end.
      - name: Install the AI research service into its own venv
        run: |
          python3 -m venv services/ai-research/.venv
          services/ai-research/.venv/bin/pip install --upgrade pip
          services/ai-research/.venv/bin/pip install -e 'services/ai-research[dev]'
      - run: npm ci
      - name: Install the browser build Playwright pins
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build the web app against the API
        run: npm --workspace apps/web run build
      - name: Run the browser acceptance journeys
        working-directory: apps/web
        run: npx playwright test
      - name: The browser report is an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
