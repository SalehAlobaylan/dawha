name: Dawha CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  core-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...

  # The committed sqlc output against the current schema. sqlc reads
  # db/migrations/*.sql as a schema FILE, so this job needs Go and nothing else -
  # no PostgreSQL, no services. It is a separate job because it is a different
  # question from "does the Go code pass": it asks whether the generated code in
  # the tree is what the schema generates, which nothing in the build would
  # otherwise notice, because nothing in the build regenerates it.
  generated:
    runs-on: ubuntu-latest
    env:
      # Pinned because the drift check is only meaningful against the generator
      # that produced the committed output: a different sqlc legitimately
      # formats differently, and that difference is not schema drift.
      SQLC_VERSION: v1.31.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
      - run: make generated-check

  # Dependency advisories and committed secrets. One job, because the four
  # scanners share one thing: they all need the network, and a gate that needs
  # the network does not belong in a job that also needs a database.
  #
  # The failure policy is in infra/security/scanner-exceptions.md, and every
  # finding these scanners reported when the gate was added is written down
  # there with what was done about it. There are no open exceptions.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history is not scanned on every push: this repository has never
          # had a credential committed, and a full-history scan on every event
          # costs more than it finds. gitleaks-action scans the whole history of
          # the default branch once a week, which is where a historical secret
          # would show up.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: services/core-api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm audit, production dependencies, then every dependency
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: govulncheck, in reachability mode
        working-directory: services/core-api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: pip-audit, from a scanner environment of its own
        run: |
          python3 -m venv /tmp/scanner
          /tmp/scanner/bin/pip install --upgrade pip pip-audit
          python3 -m venv services/ai-research/.venv
          services/ai-research/.venv/bin/pip install -e 'services/ai-research[dev]'
          # --path, not a bare `pip-audit` inside the service venv: the scanner's
          # own dependencies must never be part of the answer it gives.
          /tmp/scanner/bin/pip-audit --path services/ai-research/.venv/lib/python*/site-packages
      - name: gitleaks, with this repository's reviewed allowlist
        uses: gitleaks/gitleaks-action@v2
        with:
          # The same .gitleaks.toml the local target uses, so a finding on a
          # laptop and a finding in CI are the same finding. `--no-git` scans the
          # checkout - the pull request - and `--redact` keeps the value out of the
          # log even if one is found, which is the whole reason the plan forbids
          # pasting a secret into output.
          args: detect --no-git --source . --redact --config .gitleaks.toml --exit-code 1

  ai-research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: python -m evaluation.evaluate_routing
      - name: Every configured quality group, with a machine-readable report
        run: python -m evaluation.evaluate

  # The complete database suite, not a hand-picked subset.
  #
  # `go test ./...` without DATABASE_URL skips every database-backed test, so
  # the run goes through tools/dbtestguard. It fails on a non-zero go test exit,
  # on DATABASE_URL set against a database that was never migrated, on any test
  # that skipped on the database gate, on a package in the required manifest that
  # ran no test at all, and on an acceptance fixture schema left behind. It
  # refuses to run without DATABASE_URL, so this job cannot quietly become the
  # unit tests and still be green.
  database:
    runs-on: ubuntu-latest
    env:
      # The whole job shares one URL, so the migrations, the seed, the suite and
      # the audit cannot disagree about which database they mean.
      DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
      # The local `db` service is built from infra/local/Dockerfile.postgres,
      # which is what provides postgis and vector. A stock postgres image cannot
      # host this schema, so the project name is pinned to keep the compose
      # project out of the way of any other checkout on the runner.
      COMPOSE_PROJECT_NAME: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: services/core-api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-research/pyproject.toml
      - run: docker compose build db
      - run: make db-migrate
      # The runner's own five cases, against a scratch database this step
      # creates and drops. A deliberately failing migration, a resumed partial
      # set, a refused edit, a backfill of a database that predates the
      # checksum, and two runners started at once: the runner is the only place
      # those can be proved, and they are the properties a deployment depends on
      # before it depends on anything else in this job.
      - name: The migration runner's five cases
        run: make migration-test
      - name: The tree and the database agree about the migrations
        run: make migration-check
      - run: make db-seed
      - name: The required extensions are installed
        run: docker compose exec -T db psql -U dawha -d dawha -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis', 'vector') ORDER BY extname;"
      # The venv is created and installed into explicitly, because that is the
      # interpreter the next step runs. Installing into the setup-python
      # environment and then calling .venv/bin/python would be two different
      # pythons, and only one of them would exist.
      - name: Install the AI research service into its own venv
        run: |
          python3 -m venv services/ai-research/.venv
          services/ai-research/.venv/bin/pip install --upgrade pip
          services/ai-research/.venv/bin/pip install -e 'services/ai-research[dev]'
      - name: Start the deterministic AI service
        working-directory: services/ai-research
        run: |
          .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then
              echo "ai-research is up"
              exit 0
            fi
            sleep 1
          done
          echo "ai-research did not start" >&2
          exit 1
      - name: Run the complete Go database suite with the skip audit
        working-directory: services/core-api
        env:
          # The one AI-backed Go test runs rather than skips, so the only skips
          # left in the run are ones somebody chose on purpose.
          AI_RESEARCH_URL: http://127.0.0.1:8000
        run: go run ./tools/dbtestguard --audit database-audit.json -- ./...
      - name: The graph packages still run on their own terms
        working-directory: services/core-api
        env:
          DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
        run: go test ./internal/research -run 'TestGraph'
      - name: The analysis packages still run on their own terms
        working-directory: services/core-api
        env:
          DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
        run: go test ./internal/temporalanalysis ./internal/geospatialintelligence ./internal/researchagent ./internal/contradiction ./internal/evidence ./internal/search ./internal/entityresolution
      # The queue is only as real as the process that drains it, so this step starts
      # the analysis worker the way a deployment does - as its own binary, against the
      # same migrated database - accepts a run through the service the API uses, and
      # waits for the run to reach a terminal state. It is the step that would fail
      # if a deployment shipped the API without the worker, which is the failure no
      # unit test can see.
      - name: A consumer really drains the queue
        working-directory: services/core-api
        env:
          DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
          AI_RESEARCH_URL: http://127.0.0.1:8000
        run: go test ./internal/analysisworker -run TestTheAnalysisWorkerBinaryDrains -count=1 -v
      - name: The skip audit is an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-audit
          path: services/core-api/database-audit.json
          if-no-files-found: error

  # The browser acceptance suite, against the same deterministic stack `make e2e`
  # starts locally: PostgreSQL with postgis and vector, the AI service, core-api
  # with its source-processing and analysis workers, and the built web app.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://dawha:dawha_local@localhost:55432/dawha
      COMPOSE_PROJECT_NAME: ci
      CORE_API_PORT: 8181
      AI_RESEARCH_PORT: 8182
      AI_RESEARCH_URL: http://localhost:8182
      WEB_E2E_PORT: 4173
      WEB_ORIGIN: http://localhost:4173
      # Vite reads this at build time, which is why the build is a step of its
      # own rather than part of the test command.
      VITE_API_URL: http://localhost:8181
      SOURCE_STORAGE_DIR: /tmp/dawha-e2e-storage
      # Abuse controls off for the browser suite, stated here as well as in
      # apps/web/e2e/stack.mjs: the twenty-eight journeys share one API and one
      # client address, and the register journey alone would spend the sign-in
      # budget. The limits are proved by platform/ratelimit and by the database
      # job, which runs the same API with them on.
      RATE_LIMIT_ENABLED: "false"
      # Demo mode is ON and explicit, matching the local development stack: the
      # dashboard route answers a dependency error when it is off, and the web
      # app's landing page is part of what a reader sees. The API labels the
      # response as demo in a header and in the body, so nothing here can mistake
      # it for real data.
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: services/core-api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-research/pyproject.toml
      - run: docker compose build db
      - run: make db-migrate
      - run: make db-seed
      # apps/web/e2e/stack.mjs starts the AI service from
      # services/ai-research/.venv and refuses to run without it, so the venv is
      # the interpreter this job uses end to end.
      - name: Install the AI research service into its own venv
        run: |
          python3 -m venv services/ai-research/.venv
          services/ai-research/.venv/bin/pip install --upgrade pip
          services/ai-research/.venv/bin/pip install -e 'services/ai-research[dev]'
      - run: npm ci
      - name: Install the browser build Playwright pins
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build the web app against the API
        run: npm --workspace apps/web run build
      - name: Run the browser acceptance journeys
        working-directory: apps/web
        run: npx playwright test
      - name: The browser report is an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
