# gitleaks configuration for this repository.
#
# The rules are gitleaks' own; nothing here disables one. The only entry in this
# file is a single allowlisted finding, and it is here because a test that
# asserts a secret-carrying variable is READ cannot avoid naming that variable.
#
# CI runs `gitleaks detect --no-git` over the checkout, so a secret introduced by
# a pull request fails the build. The history is not scanned on every run: this
# repository has never had a credential committed (the local database password is
# a development default that is in .env.example on purpose), and scanning the
# whole history on every push costs more than it finds.
title = "dawha"

[extend]
# gitleaks' default ruleset, unmodified.
useDefault = true

[[allowlists]]
description = """
A Go test asserts that ConfigFromEnvironment reads S3_SECRET_ACCESS_KEY, so the
literal "S3_SECRET_ACCESS_KEY" has to appear in the source. gitleaks'
generic-api-key rule fires on the assignment pattern rather than on the value, and
every value tried - including "not-a-real-credential" - trips it, so the finding
cannot be removed from the source without removing the test.

This is one file, one rule, one line, and the value beside the name is a
placeholder that authenticates nothing. If somebody pastes a real credential into
that map, the same rule fires on a DIFFERENT line and the allowlist does not
cover it, because the path is pinned to the file and the rule to the id - not to
a value.
"""
paths = ['''services/core-api/platform/storage/s3_test\.go''']
ruleIDs = ["generic-api-key"]
