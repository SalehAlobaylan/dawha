[project]
name = "dawha-ai-research"
version = "0.2.0"
description = "Deterministic and model-assisted research capabilities for Dawha"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=9.0.3,<10.0.0",
  "ruff>=0.8.0,<1.0.0"
]

# `app` and `evaluation` are both real top-level packages, and setuptools
# refuses to guess between them in a flat layout. Naming them keeps
# `pip install -e '.[dev]'` - which `make install` and every CI job run -
# working, instead of failing with "Multiple top-level packages discovered".
# `tests` is deliberately not packaged: it is a test suite for this service, not
# something a consumer imports.
[tool.setuptools]
packages = ["app", "evaluation"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
