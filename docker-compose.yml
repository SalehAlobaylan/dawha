services:
  db:
    platform: linux/amd64
    build:
      context: .
      dockerfile: infra/local/Dockerfile.postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dawha}
      POSTGRES_USER: ${POSTGRES_USER:-dawha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawha_local}
    ports:
      - "55432:5432"
    volumes:
      - dawha_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dawha_postgres:
